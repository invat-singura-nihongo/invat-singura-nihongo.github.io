<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashcards · Învăț singură nihongo</title><link rel="stylesheet" href="style.css?v=larger-lesson-text"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
.game{max-width:520px;margin:auto}.game h1{font-size:clamp(26px,5vw,38px);margin:0}.top,.controls,.ratings,.stats{display:flex;align-items:center;justify-content:space-between;gap:8px}.track{height:8px;background:#e8dfd4;border-radius:20px;margin:12px 0 20px;overflow:hidden}.track div{height:100%;background:#8caa99;transition:width .2s}.flip{position:relative;width:100%;min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:2px solid #c6a88d;border-radius:18px;background:#fff8e8;color:#654c40;box-shadow:4px 4px #e8b1a6;padding:24px 14px;font:inherit;cursor:pointer;touch-action:manipulation}.flip:before{content:'';position:absolute;width:90px;height:24px;background:#b9d5cc;opacity:.85;top:-10px;left:calc(50% - 45px);transform:rotate(-5deg)}.flip.back{background:#f3e4d8}.flip img{width:165px;height:150px;object-fit:contain}.flip .question{font-weight:900;font-size:25px}.hint{font-size:14px;color:#82695b}.kana{font-size:clamp(32px,7vw,48px);font-weight:900}.romaji{font-size:22px;color:#876a5a}.meaning{font-weight:900;font-size:24px;border-top:1px solid #c6a88d;padding-top:14px;min-width:55%}.ratings,.controls{margin-top:16px}.ratings button{flex:1}.game button:not(.flip){font-family:inherit;cursor:pointer;min-height:44px}.game button:disabled{opacity:.35;cursor:default}.stats{margin:20px 0 8px;border-top:1px solid #dabbab;padding-top:14px;text-align:center}.stats div{flex:1;font-size:13px}.stats strong{display:block;font-size:25px}.reset{display:block;margin:12px auto 0}.ratings[hidden]{display:none}.controls .btn{margin:0;padding:8px 12px}.known{background:#bdd8c5}.stars{position:absolute;bottom:12px;left:16px;color:#e2b980;font-size:24px}.stars.right{left:auto;right:16px;bottom:auto;top:12px;color:#d9a4ab}@media(max-width:480px){.flip{min-height:280px}.controls .btn{padding:8px;font-size:14px}}
</style></head><body><div class="shell"><header class="subpage-header"><a class="brand" href="index.html">Învăț singură nihongo</a><nav aria-label="Meniu principal"><a href="index.html#lectii">Lecții</a><a href="index.html#practica">Practică</a><a href="index.html#despre">Despre</a></nav></header><main><section class="game"><div class="top"><h1>ことばカード 🌸</h1><span id="counter"></span></div><div class="track"><div id="bar"></div></div><button type="button" class="flip" id="card" aria-label="Întoarce cardul"></button><div class="ratings" id="ratings" hidden><button class="btn secondary" id="again">Mai exersez</button><button class="btn known" id="known">✓ Știam!</button></div><div class="controls"><button class="btn secondary" id="prev">‹ Înapoi</button><button class="btn secondary" id="shuffle" aria-label="Amestecă">⤨</button><button class="btn secondary" id="next">Următorul ›</button></div><div class="stats" aria-live="polite"><div>Știu<strong id="yes">0</strong></div><div>Mai exersez<strong id="no">0</strong></div><div>Rămase<strong id="left">10</strong></div></div><button class="btn secondary reset" id="reset">↻ Reîncepe</button></section></main><footer><span lang="ja">またね！</span> · Pe curând!<p class="credit">Ilustrații de pe <a href="https://www.vecteezy.com/">Vecteezy.com</a> și <a href="https://www.freepik.com/">Freepik</a></p></footer></div><script>
const cards=[['japan-kokeshi.webp','にんぎょう','ningyō','Păpușă'],['japan-bonsai.webp','ぼんさい','bonsai','Bonsai'],['japan-koi-1.webp','こい','koi','Pește koi'],['japan-koi-2.webp','さかな','sakana','Pește'],['japan-lantern.webp','ちょうちん','chōchin','Lampion'],['japan-zen-stones.webp','いし','ishi','Piatră'],['japan-geta-1.webp','げた','geta','Sandale geta'],['japan-geta-2.webp','くつ','kutsu','Încălțăminte'],['strawberry.svg','いちご','ichigo','Căpșună'],['red-tulip.svg','はな','hana','Floare']];
const $=id=>document.getElementById(id);let order=cards.map((_,i)=>i),index=0,flipped=false,scores={};function render(){const c=cards[order[index]];$('counter').textContent=(index+1)+' / '+cards.length;$('bar').style.width=((index+1)/cards.length*100)+'%';$('card').classList.toggle('back',flipped);$('card').setAttribute('aria-pressed',String(flipped));$('card').innerHTML=flipped?'<span class="kana" lang="ja">'+c[1]+'</span><span class="romaji">'+c[2]+'</span><span class="meaning">'+c[3]+'</span><span class="hint">Atinge pentru a întoarce cardul</span>':'<span class="stars" aria-hidden="true">✧</span><span class="stars right" aria-hidden="true">✦</span><img src="assets/'+c[0]+'" alt="Imagine de vocabular"><span class="question" lang="ja">なんですか。</span><span class="hint">Atinge pentru răspuns</span>';$('ratings').hidden=!flipped;$('yes').textContent=Object.values(scores).filter(v=>v===true).length;$('no').textContent=Object.values(scores).filter(v=>v===false).length;$('left').textContent=cards.length-Object.keys(scores).length}
function move(n){index=(index+n+cards.length)%cards.length;flipped=false;render()}$('card').onclick=()=>{flipped=!flipped;render()};$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('again').onclick=()=>{scores[order[index]]=false;move(1)};$('known').onclick=()=>{scores[order[index]]=true;move(1)};$('shuffle').onclick=()=>{for(let j=order.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[order[j],order[k]]=[order[k],order[j]]}index=0;flipped=false;render()};$('reset').onclick=()=>{index=0;flipped=false;scores={};render()};render();
</script></body></html>
