<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marugoto A1 – さくぶん</title><style>@import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Patrick+Hand&family=Playpen+Sans&display=swap');*{box-sizing:border-box}body{margin:auto;max-width:900px;padding:20px;background:#fffcf5;color:#51483f;font:16px 'Kosugi Maru',sans-serif}section{background:white;padding:20px;margin:20px 0;border:1px solid #ddd;border-radius:12px}h1,h2{color:#526c59}nav{display:flex;flex-wrap:wrap;gap:8px}a,button{padding:10px;background:#e9eee3;color:#405642;border:1px solid #b8c5b4;border-radius:8px;text-decoration:none;cursor:pointer}input,textarea{font:inherit;width:100%;padding:10px;border:1px solid #c9c4b8;border-radius:6px;background:#fffdf8}textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;align-items:center}.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#a98c65;padding:6px;max-width:420px}.cell{background:#f8eedb;min-height:100px;display:grid;place-items:center;text-align:center;padding:5px}.piece{font-size:38px;touch-action:none;user-select:none;cursor:grab;display:inline-flex;flex-direction:column;align-items:center;background:#f5e6e1;padding:8px;border-radius:8px}.piece small,.cell small{font-size:12px}.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:100px}.selected{outline:3px solid #526c59}.ghost{position:fixed;pointer-events:none;z-index:99;opacity:.8}canvas{width:100%;height:160px;border:1px dashed #aaa;touch-action:none}footer{font:12px sans-serif}</style><h1>まるごと A1 · さくぶん</h1><p lang="ro" style="font-family:Playpen Sans">Fișe interactive · Lecțiile 3–10</p><p style="font-size:13px;color:#85786b">Tap a Japanese example sentence to show or hide its romaji.</p><nav id="nav"></nav><main id="main"></main><footer>Adapted from the supplied Marugoto Starter A1 writing worksheets. ©2013 The Japan Foundation / SANSHUSHA Publishing Co., Ltd. Illustrations in the shelf prototype are symbolic substitutes.</footer><script>
const data=[
['じこしょうかい',['わたしは のだです。','にほんじんです。','かいしゃいんです。','えいごが できます。','アラビアごも できます。','どうぞ よろしく。'],'Write your self-introduction.'],
['わたしの かぞく',['わたしの かぞくは さんにんです。','ちちと ははと わたしです。','わたしたちは おおさかに すんでいます。'],'Draw a simple picture and write sentences about your family.'],
['わたしの あさごはん',['わたしは いつも パンを たべます。','やさいと たまごも たべます。','ごはんは あまり たべません。','よく コーヒーを のみます。','こうちゃも すきです。','ジュースは あまり すきじゃないです。'],'Draw a picture and write about your breakfast.'],
['わたしの ひるごはん',['すきな りょうりは すしです。','そばは あまり すきじゃないです。','ひるごはんは「えどずし」で たべます。','「えどずし」は やすくないです。','でも、おいしいです。'],'Where do you have lunch, what do you eat and what kind of restaurant do you go to?'],
['わたしの いえ',['わたしは きょうとに すんでいます。','わたしの いえは いっこだてです。','わたしの いえは あたらしいです。','わたしは かぞくと すんでいます。','ねこと いぬも います。'],'Write an e-mail or letter about your home to a friend.'],
['わたしの へや',['ちちの へやに たなが あります。','フランスの とけいは アメリカの しゃしんの よこです。','ちゅうごくの しゃしんは にほんの にんぎょうの うえです。'],'Place a–d on the shelf and write sentences about your shelf.'],
['わたしの いちにち',['7じ15ふんに おきます。','8じに かいしゃに いきます。','よる8じごろ うちに かえります。','テレビを みます。','シャワーを あびます。','12じはんごろ ねます。'],'What do you do every day, and what time do you do it?'],
['こんしゅうの よてい',['げつようびから きんようびまで かいしゃに いきます。','かいしゃは 9じから 5じまでです。','どようびと にちようびは やすみです。','どようびは かいものをします。','にちようびは あさから ともだちと テニスを します。','こんしゅうは いそがしいです。'],'Write about your schedule for next week.']];
const main=document.querySelector('#main');data.forEach((d,i)=>{let n=i+3;document.querySelector('#nav').insertAdjacentHTML('beforeend','<a href="#l'+n+'">Lesson '+n+'</a>');let s=document.createElement('section');s.id='l'+n;s.innerHTML='<h2>だい '+n+' か · '+d[0]+'</h2><div class="row"><input placeholder="なまえ"><input type="date"></div><h3>1. ぶんを かきましょう。</h3>'+d[1].map(t=>'<div class="row"><span>'+t+'</span><input aria-label="Copy sentence" placeholder="ここに かきましょう"></div>').join('')+'<h3>2. '+d[2]+'</h3>';if(n===8)s.innerHTML+='<div id="tray" class="tray"></div><p>Drag the objects to empty compartments, or tap an object then a compartment.</p><div id="shelf" class="shelf"></div><button id="reset">Reset shelf</button>'+['マレーシアの カップは','ちゅうごくの しゃしんは','フランスの とけいは','エジプトの しゃしんは'].map(t=>'<p>'+t+'</p><input>').join('');else if(n===9)s.innerHTML+=Array.from({length:7},()=>'<div class="row"><input type="time"><input placeholder="なにを しますか"></div>').join('');else{s.innerHTML+=([3,4,5,7].includes(n)?'<canvas width="800" height="250"></canvas><button class="clear">Clear drawing</button>':'')+'<textarea placeholder="ここに かきましょう"></textarea>'}main.append(s)});
const tray=document.querySelector('#tray'),shelf=document.querySelector('#shelf');const objects=[['☕','マレーシアの カップ'],['🏞️','ちゅうごくの しゃしん'],['🕰️','フランスの とけい'],['🔺','エジプトの しゃしん']];let selected=null;function setup(){tray.innerHTML='';shelf.innerHTML='';selected=null;['🎎','','🍵','','🪆','','🗽','','🎎'].forEach((v,i)=>{let c=document.createElement('div');c.className='cell';if(v){c.innerHTML='<span style="font-size:36px">'+v+'</span><small>'+({0:'かんこく',2:'イギリス',4:'ロシア',6:'アメリカ',8:'にほん'}[i])+'</small>';c.dataset.fixed='1'}shelf.append(c)});objects.forEach(([icon,label])=>{let p=document.createElement('div');p.className='piece';p.innerHTML=icon+'<small>'+label+'</small>';tray.append(p);p.addEventListener('pointerdown',e=>{e.preventDefault();let x=e.clientX,y=e.clientY;let g=p.cloneNode(true);g.classList.add('ghost');g.style.left=x-30+'px';g.style.top=y-30+'px';document.body.append(g);p.setPointerCapture(e.pointerId);p.onpointermove=a=>{g.style.left=a.clientX-30+'px';g.style.top=a.clientY-30+'px'};p.onpointerup=a=>{g.remove();p.onpointermove=null;p.onpointerup=null;let target=document.elementFromPoint(a.clientX,a.clientY)?.closest('.cell,#tray');if(Math.hypot(a.clientX-x,a.clientY-y)>8&&target)place(p,target);else{selected?.classList.remove('selected');selected=p;p.classList.add('selected')}};p.onpointercancel=()=>{g.remove();p.onpointermove=null;p.onpointerup=null}})})}function place(p,t){if(t.dataset.fixed)return;if(t!==tray&&t.querySelector('.piece'))return;t.append(p);p.classList.remove('selected');selected=null}setup();shelf.addEventListener('click',e=>{let t=e.target.closest('.cell');if(selected&&t)place(selected,t)});tray.addEventListener('click',e=>{if(selected&&e.target===tray)place(selected,tray)});document.querySelector('#reset').onclick=setup;
document.querySelectorAll('canvas').forEach(c=>{let ctx=c.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';let active=false;function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{active=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(active){ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=c.onpointercancel=()=>active=false;c.nextElementSibling.onclick=()=>ctx.clearRect(0,0,c.width,c.height)});

const readings=[["Watashi wa Noda desu.","Nihonjin desu.","Kaishain desu.","Eigo ga dekimasu.","Arabia-go mo dekimasu.","Dōzo yoroshiku."],["Watashi no kazoku wa sannin desu.","Chichi to haha to watashi desu.","Watashitachi wa Ōsaka ni sunde imasu."],["Watashi wa itsumo pan o tabemasu.","Yasai to tamago mo tabemasu.","Gohan wa amari tabemasen.","Yoku kōhī o nomimasu.","Kōcha mo suki desu.","Jūsu wa amari suki janai desu."],["Suki na ryōri wa sushi desu.","Soba wa amari suki janai desu.","Hirugohan wa Edozushi de tabemasu.","Edozushi wa yasukunai desu.","Demo, oishii desu."],["Watashi wa Kyōto ni sunde imasu.","Watashi no ie wa ikkodate desu.","Watashi no ie wa atarashii desu.","Watashi wa kazoku to sunde imasu.","Neko to inu mo imasu."],["Chichi no heya ni tana ga arimasu.","Furansu no tokei wa Amerika no shashin no yoko desu.","Chūgoku no shashin wa Nihon no ningyō no ue desu."],["Shichiji jūgofun ni okimasu.","Hachiji ni kaisha ni ikimasu.","Yoru hachiji goro uchi ni kaerimasu.","Terebi o mimasu.","Shawā o abimasu.","Jūniji han goro nemasu."],["Getsuyōbi kara kinyōbi made kaisha ni ikimasu.","Kaisha wa kuji kara goji made desu.","Doyōbi to nichiyōbi wa yasumi desu.","Doyōbi wa kaimono o shimasu.","Nichiyōbi wa asa kara tomodachi to tenisu o shimasu.","Konshū wa isogashii desu."]];document.querySelectorAll('main section').forEach((section,i)=>{section.querySelectorAll('.row > span').forEach((span,j)=>{const hint=document.createElement('small');hint.textContent=readings[i][j];hint.hidden=true;hint.style.cssText='display:none;color:#85786b;font:15px "Patrick Hand",sans-serif;margin-top:5px';const b=document.createElement('button');b.type='button';b.textContent=span.textContent;b.style.cssText='background:none;border:0;padding:4px 0;text-align:left;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:4px';b.setAttribute('aria-expanded','false');b.title='Show or hide romaji';b.onclick=()=>{hint.hidden=!hint.hidden;hint.style.display=hint.hidden?'none':'block';b.setAttribute('aria-expanded',String(!hint.hidden))};span.replaceChildren(b,hint)});});
</script></html>
