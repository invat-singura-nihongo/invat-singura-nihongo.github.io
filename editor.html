<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nihongo Design Studio</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#303044;background:#f5f3fa}button,input,select,textarea{font:inherit}button,select,input{min-height:42px;border:1px solid #d9d3e6;border-radius:9px;background:white;padding:8px;color:inherit}button{cursor:pointer}button:active{background:#e5def7}button.primary{background:#7655bc;color:white}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;background:white;border-bottom:1px solid #ddd}header strong{font-size:18px;margin-right:8px}#workspace{display:grid;grid-template-columns:minmax(0,1fr) 270px;height:calc(100dvh - 115px)}#stage{overflow:auto;background:#e4e0ec;padding:12px}iframe{display:block;border:0;background:white;width:100%;height:100%;min-height:450px;box-shadow:0 2px 12px #0002}aside{overflow:auto;padding:12px;background:white;border-left:1px solid #ddd}aside label{display:block;font-size:12px;color:#666;margin:10px 0 4px}aside input,aside select,aside textarea{width:100%}textarea{border:1px solid #ddd;border-radius:8px;padding:8px;min-height:74px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tools{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#eeeaf6}#status{padding:4px 12px;font-size:12px;min-height:24px}#selected{font-weight:700;overflow-wrap:anywhere}#asset{display:none}@media(max-width:700px){#workspace{grid-template-columns:1fr;height:auto}#stage{height:58dvh}aside{border:0}header strong{width:100%}}
</style></head><body><header><strong>🌸 Nihongo Design Studio</strong><select id="pages" aria-label="Page"></select><button id="new">＋ Page</button><button id="save">Save draft</button><button id="publish" class="primary">Publish to GitHub</button><button id="download">Export HTML</button></header><div class="tools"><button id="text">＋ Text</button><button id="image">＋ Image / SVG</button><input id="asset" type="file" accept="image/*,.svg" multiple><button id="undo">Undo</button><button id="redo">Redo</button><button id="preview">Preview links</button><button id="mobile">Phone view</button><button id="desktop">Full width</button></div><div id="status" role="status">Tap an element to select it. Drag to move.</div><div id="workspace"><div id="stage"><iframe id="frame" sandbox="allow-same-origin" title="Website editing canvas"></iframe></div><aside><div id="selected">No element selected</div><label>Text (select individual text first)</label><textarea id="copy"></textarea><button id="applyText">Apply text</button><label>Font family</label><select id="font"><option value="">Original</option><option>Nunito</option><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Trebuchet MS</option><option>Times New Roman</option><option>Courier New</option><option>cursive</option><option>sans-serif</option><option>serif</option></select><label>Custom font family (must be installed or loaded)</label><input id="customFont" placeholder="e.g. Noto Sans JP"><div class="pair"><div><label>Font size (px)</label><input id="size" type="number" min="1" max="300"></div><div><label>Rotation (°)</label><input id="rotation" type="number" min="-360" max="360"></div><div><label>Text colour</label><input id="color" type="color"></div><div><label>Background</label><input id="bg" type="color"></div><div><label>Width (px)</label><input id="width" type="number" min="1"></div><div><label>Height (px)</label><input id="height" type="number" min="1"></div><div><label>Move X (px)</label><input id="x" type="number"></div><div><label>Move Y (px)</label><input id="y" type="number"></div></div><label>Formatting</label><div class="pair"><button id="bold">Bold</button><button id="italic">Italic</button><button id="center">Center text</button><button id="clearbg">Clear background</button></div><label>Link to another page or URL</label><select id="targets"></select><input id="url" placeholder="lectia-1.html or https://…"><button id="link">Apply link</button><label>Layers & elements</label><div class="pair"><button id="front">Bring front</button><button id="back">Send back</button><button id="parent">Select parent</button><button id="duplicate">Duplicate</button><button id="delete">Delete</button><button id="reset">Reset position</button></div><label>Tip: drag the blue corner to resize. Use Preview links to test navigation. Drafts are saved only on this device.</label></aside></div>
<script>
const $=id=>document.getElementById(id), f=$('frame'), repo='invat-singura-nihongo/invat-singura-nihongo.github.io', key='nihongo-studio-v1';
let state={pages:{},names:['index.html','lectia-1.html','lectia-2.html','lectia-3.html','lectia-4.html','vocabular.html','gramatica.html','expresii.html']};try{const v=JSON.parse(localStorage.getItem(key));if(v)state=v}catch{}
let current='',el=null,history=[],future=[],preview=false,drag=null,token='',loading=false;
const status=s=>$('status').textContent=s;
function menus(){for(const id of ['pages','targets']){const n=$(id);n.replaceChildren();if(id==='targets')n.add(new Option('Choose page…',''));for(const p of state.names)n.add(new Option(p,p));} $('pages').value=current;}
function doc(){return f.contentDocument}
function clean(){const d=doc().documentElement.cloneNode(true);d.querySelectorAll('[data-studio-ui]').forEach(n=>n.remove());d.querySelectorAll('[data-studio-selected]').forEach(n=>n.removeAttribute('data-studio-selected'));return '<!doctype html>\n'+d.outerHTML}
function persist(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch{status('Device storage full. Export HTML before closing.');return false}}
function stash(){if(current&&!loading&&doc()?.body){state.pages[current]=clean();return persist()}return true}
function checkpoint(){history.push(clean());if(history.length>40)history.shift();future=[]}
function render(html){return new Promise(resolve=>{loading=true;el=null;$('selected').textContent='No element selected';f.onload=()=>{loading=false;wire();resolve()};f.srcdoc=html})}
async function open(p){if(!p||loading)return;stash();let html=state.pages[p];if(!html){try{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error('Page not found');html=await r.text()}catch(e){status(e.message);return}}current=p;history=[];future=[];menus();await render(html);status('Editing '+p)}
function newPage(){const raw=prompt('New page name (e.g. lesson-5)');if(!raw)return;const p=raw.replace(/\.html$/i,'').trim().replace(/[^a-zA-Z0-9_-]+/g,'-')+'.html';if(p==='.html'||p==='editor.html'||state.names.includes(p)){status('Choose a different page name.');return}stash();state.names.push(p);state.pages[p]='<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+p+'</title><link rel="stylesheet" href="style.css"></head><body><div class="shell"><header><a href="index.html">Acasă</a></header><main><h1>New page</h1><p>Tap to edit this text.</p></main></div></body></html>';persist();open(p)}
function offset(n){const a=(n.style.translate||'0px 0px').split(' ');return [parseFloat(a[0])||0,parseFloat(a[1])||0]}
function sync(){if(!el)return;const c=doc().defaultView.getComputedStyle(el), r=el.getBoundingClientRect(), [x,y]=offset(el);$('selected').textContent=el.tagName.toLowerCase()+(el.className&&typeof el.className==='string'?' · '+el.className:'');$('copy').value=el.textContent.trim();$('copy').disabled=!!el.children.length||el.tagName==='IMG';$('applyText').disabled=$('copy').disabled;$('size').value=parseFloat(c.fontSize)||16;$('width').value=Math.round(r.width);$('height').value=Math.round(r.height);$('rotation').value=parseFloat(el.style.rotate)||0;$('x').value=x;$('y').value=y;$('url').value=el.closest('a')?.getAttribute('href')||'';$('customFont').value=el.style.fontFamily;const hex=v=>{const a=v.match(/\d+/g);return a&&a.length>=3?'#'+a.slice(0,3).map(x=>Number(x).toString(16).padStart(2,'0')).join(''):'#ffffff'};$('color').value=hex(c.color);$('bg').value=hex(c.backgroundColor);handle()}
function handle(){const h=doc().querySelector('#studio-handle');if(!h)return;if(!el||preview){h.style.display='none';return}const r=el.getBoundingClientRect();h.style.cssText='position:fixed;z-index:2147483647;width:28px;height:28px;background:#7260dc;border:3px solid white;border-radius:8px;touch-action:none;cursor:nwse-resize;left:'+(r.right-14)+'px;top:'+(r.bottom-14)+'px';}
function select(n){if(!n||n===doc().documentElement)return;el?.removeAttribute('data-studio-selected');el=n;el.setAttribute('data-studio-selected','');sync()}
function wire(){const d=doc();const s=d.createElement('style');s.dataset.studioUi='';s.textContent='[data-studio-selected]{outline:2px dashed #7260dc!important;outline-offset:2px}body.studio-edit *{touch-action:pan-y}body.studio-edit [data-studio-selected]{touch-action:none!important;cursor:move}';d.head.append(s);const h=d.createElement('div');h.id='studio-handle';h.dataset.studioUi='';h.style.display='none';d.body.append(h);d.addEventListener('click',e=>{const a=e.target.closest('a');if(a){e.preventDefault();if(preview){const href=a.getAttribute('href')||'';if(href.startsWith('#'))d.getElementById(href.slice(1))?.scrollIntoView();else if(state.names.includes(href.split('#')[0]))open(href.split('#')[0]);else status('Link: '+href)}}},true);
d.addEventListener('pointerdown',e=>{if(preview||e.button!==0)return;let resize=e.target===h;if(!resize&&e.target!==el){select(e.target);return}if(!el)return;e.preventDefault();checkpoint();const r=el.getBoundingClientRect();drag={px:e.clientX,py:e.clientY,x:offset(el)[0],y:offset(el)[1],w:el.offsetWidth||r.width,hh:el.offsetHeight||r.height,resize};e.target.setPointerCapture(e.pointerId)});
d.addEventListener('pointermove',e=>{if(!drag||!el)return;const dx=e.clientX-drag.px,dy=e.clientY-drag.py;if(drag.resize){el.style.width=Math.max(15,drag.w+dx)+'px';el.style.height=Math.max(15,drag.hh+dy)+'px';el.style.maxWidth='none';if(el.tagName==='IMG')el.style.objectFit='contain'}else el.style.translate=(drag.x+dx)+'px '+(drag.y+dy)+'px';handle()});
function end(){if(drag){drag=null;sync();stash()}}d.addEventListener('pointerup',end);d.addEventListener('pointercancel',end);d.addEventListener('scroll',handle,true);d.defaultView.addEventListener('resize',handle);setMode()}
function setMode(){if(!doc()?.body)return;const s=doc().querySelector('style[data-studio-ui]');if(s)s.disabled=preview;doc().body.style.cursor='';if(!preview&&s)s.textContent='[data-studio-selected]{outline:2px dashed #7260dc!important;outline-offset:2px;touch-action:none!important;cursor:move}';handle();$('preview').textContent=preview?'Return to edit':'Preview links'}
function change(fn){if(!el){status('Select an element first.');return}checkpoint();fn(el);sync();stash()}
function style(id,prop,unit=''){ $(id).onchange=()=>change(n=>n.style[prop]=$(id).value+unit)}
style('font','fontFamily');style('customFont','fontFamily');style('size','fontSize','px');style('rotation','rotate','deg');style('color','color');style('bg','backgroundColor');style('width','width','px');style('height','height','px');
for(const id of ['x','y'])$(id).onchange=()=>change(n=>n.style.translate=($('x').value||0)+'px '+($('y').value||0)+'px');
$('applyText').onclick=()=>change(n=>{if(!n.children.length&&n.tagName!=='IMG')n.textContent=$('copy').value});
$('bold').onclick=()=>change(n=>n.style.fontWeight=doc().defaultView.getComputedStyle(n).fontWeight==='700'?'400':'700');$('italic').onclick=()=>change(n=>n.style.fontStyle=n.style.fontStyle==='italic'?'normal':'italic');$('center').onclick=()=>change(n=>n.style.textAlign='center');$('clearbg').onclick=()=>change(n=>n.style.backgroundColor='transparent');$('reset').onclick=()=>change(n=>{n.style.translate='';n.style.rotate=''});$('front').onclick=()=>change(n=>{if(doc().defaultView.getComputedStyle(n).position==='static')n.style.position='relative';n.style.zIndex='1000'});$('back').onclick=()=>change(n=>{if(doc().defaultView.getComputedStyle(n).position==='static')n.style.position='relative';n.style.zIndex='0'});$('parent').onclick=()=>{if(el?.parentElement)select(el.parentElement)};
$('duplicate').onclick=()=>change(n=>{if(n===doc().body)return;const c=n.cloneNode(true);c.removeAttribute('id');c.querySelectorAll('[id]').forEach(k=>k.removeAttribute('id'));n.after(c);select(c)});$('delete').onclick=()=>{if(!el||el===doc().body||!confirm('Delete selected element?'))return;checkpoint();el.remove();el=null;handle();$('selected').textContent='No element selected';stash()};
$('targets').onchange=()=>{$('url').value=$('targets').value};$('link').onclick=()=>{const url=$('url').value.trim();if(!url||/^(javascript|data|vbscript):/i.test(url)){status('Enter a safe page or URL.');return}change(n=>{let a=n.closest('a');if(!a){if(n.querySelector('a')||n===doc().body){status('Select a smaller element.');return}a=doc().createElement('a');n.before(a);a.append(n)}a.setAttribute('href',url)})};
function add(n){checkpoint();const d=doc();const target=el?.closest('section')||d.querySelector('main')||d.body;target.append(n);select(n);stash()}
$('text').onclick=()=>{const n=doc().createElement('p');n.textContent='New text';n.style.cssText='display:block;font-size:24px;width:fit-content;position:relative';add(n)};
$('image').onclick=()=>$('asset').click();$('asset').onchange=async()=>{for(const file of $('asset').files){if(!file.type.startsWith('image/')&&!file.name.endsWith('.svg'))continue;const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});const n=doc().createElement('img');n.src=data;n.alt=file.name;n.style.cssText='width:180px;height:auto;display:inline-block;position:relative';add(n)}$('asset').value=''};
$('undo').onclick=async()=>{if(!history.length)return;future.push(clean());await render(history.pop());stash()};$('redo').onclick=async()=>{if(!future.length)return;history.push(clean());await render(future.pop());stash()};
$('pages').onchange=()=>open($('pages').value);$('new').onclick=newPage;$('save').onclick=()=>{if(stash())status('Draft saved on this device.')};$('preview').onclick=()=>{preview=!preview;setMode()};$('mobile').onclick=()=>{f.style.width='390px';f.style.maxWidth='100%';f.style.margin='auto'};$('desktop').onclick=()=>{f.style.width='100%';f.style.margin='0'};
$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([clean()],{type:'text/html'}));a.download=current;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const b64=s=>{const bytes=new TextEncoder().encode(s);let b='';for(let i=0;i<bytes.length;i+=8192)b+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(b)};
$('publish').onclick=async()=>{if(!current||loading)return;stash();if(!confirm('Publish '+current+' to the live website? Other pages will not be changed.'))return;if(!token){token=prompt('Enter a fine-grained GitHub token for this repository with Contents: Read and write. It stays in memory until you close the editor.')||'';if(!token)return}const url='https://api.github.com/repos/'+repo+'/contents/'+encodeURIComponent(current);const headers={Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'};try{const r=await fetch(url+'?ref=main',{headers});let sha;if(r.ok){sha=(await r.json()).sha;if(!confirm('This file already exists on GitHub. Replace it with your current draft?'))return}else if(r.status!==404)throw Error('GitHub read failed: '+r.status);const res=await fetch(url,{method:'PUT',headers,body:JSON.stringify({message:'Update '+current+' in Design Studio',content:b64(clean()),branch:'main',...(sha?{sha}:{})})});if(!res.ok)throw Error('Publish failed: '+res.status+' '+(await res.json()).message);status('Published '+current+'. GitHub Pages may take time to update.')}catch(e){token='';status(e.message)}};
menus();open('index.html');
</script></body></html>
